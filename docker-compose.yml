
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  redis:
    image: redis:6
    restart: always
    logging: *default-logging
    volumes:
      - redis_data:/data
    # Keep Redis persistence under /data (volume-mounted) and avoid relying on an external redis.conf.
    # Use sh so we can reference the container env var for the password.
    # NOTE: docker-compose does variable interpolation on `$...` inside strings.
    # Use `$$` to pass `$REDIS_PASSWORD` through to the container shell so it expands there.
    command: ["sh", "-c", "exec redis-server --dir /data --dbfilename redis_miner --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=tinntenRedis123
    mem_limit: 256m
    cpus: 0.25
    networks:
      - tinnten-net

  mongodb:
    image: mongo:7.0
    container_name: tinnten-mongodb
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/opt/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: tinntenMongo123
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/opt/mongo-keyfile"]
    networks:
      - tinnten-net
      - tinnten-mcp-internal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 12g
    cpus: 6.0
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - tinnten-net

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    networks:
      - tinnten-net

  clamav:
    image: clamav/clamav:1.4
    container_name: tinnten-clamav
    restart: always
    logging: *default-logging
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 2g
    cpus: 1.0
    networks:
      - tinnten-net

  tinnten-server:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    volumes:
      - ./tinnten-server/token:/app/token
      - conversation_storage:/app/storage/conversation
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:5001:5001"
    restart: always
    logging: *default-logging
    depends_on:
      - redis
      - rabbitmq
      - mongodb
      - elasticsearch
    environment:
      - DISABLE_AUTO_CAMPAIGN_WORKER=true
      - NODE_ENV=production
      - DISABLE_AUTO_FILE_INTELLIGENCE_WORKER=true
      - DISABLE_AUTO_ERROR_WORKER=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=tinntenRedis123
      - ELASTICSEARCH_BASE_URL=http://elasticsearch:9200
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - RABBITMQ_PROTOCOL=amqp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - FETCHER_URL=http://tinnten-fetcher:5005
      - EMBEDDING_BASE_URL=http://tinnten-embedding:5003
      - PRODUCT_CATALOG_SERVICE_URL=http://product-catalog:5010
      - CRON_SERVICE_URL=http://tinnten-cron:5005
      - CRON_URL=http://tinnten-cron:5005
      - RABBIT_URL=amqp://admin:password@rabbitmq:5672/
      # Workflow Engine — AES-256 şifreleme anahtarı (64 hex char = 32 byte). .env üzerinden set edin.
      # WORKFLOW_ENCRYPTION_KEY=<64-hex-char-key>
    networks:
      tinnten-net:
      tinnten-ai-net:
      tinnten-mcp-registry:
        aliases:
          - tinnten-server-mcp-registry
      sites-net:

  # Tinnten hosted MCP control plane. Builder kimliği Keycloak'tan, server
  # firma üyeliği ve mcp:server.access:read kararı tinnten-server'dan alınır.
  tinnten-mpc-control-api:
    build:
      context: ./tinnten-mpc-server
      dockerfile: deploy/Dockerfile
      target: app
    env_file:
      - ./tinnten-mpc-server/.env
    command: ["node", "apps/control-api/dist/main.js"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3910
      - MONGO_URL=mongodb://root:tinntenMongo123@mongodb:27017/tinnten-mcp?authSource=admin
      - MONGO_DB=tinnten-mcp
      - MCP_ENVIRONMENT=production
      - MCP_DEPLOYMENT_MODE=hosted
      - TINNTEN_AUTHORIZATION_URL=http://tinnten-server:5001/api/v10/mcp-servers/runtime/{serverId}/access
      - TINNTEN_MCP_SERVERS_URL=http://tinnten-server:5001/api/v10/mcp-servers
      - AUTH_COOKIE_SECURE=true
    depends_on:
      - mongodb
      - tinnten-server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3910/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    networks:
      tinnten-net:
      tinnten-mcp-internal:
        aliases:
          - control-api

  # Runtime ortak tinnten-net'e bağlı değildir. Gateway'i atlayarak aynı
  # Docker ağından tool çağrılması önlenir. tinnten-mcp-egress ağında başka
  # servis yoktur; bu ağ yalnız connector çıkışları içindir.
  tinnten-mpc-runtime:
    build:
      context: ./tinnten-mpc-server
      dockerfile: deploy/Dockerfile
      target: app
    env_file:
      - ./tinnten-mpc-server/.env
    command: ["node", "apps/mcp-runtime/dist/main.js"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3900
      - MONGO_URL=mongodb://root:tinntenMongo123@mongodb:27017/tinnten-mcp?authSource=admin
      - MONGO_DB=tinnten-mcp
      - MCP_ENVIRONMENT=production
      - MCP_DEPLOYMENT_MODE=hosted
      - MCP_AUTH_MODE=jwt
      - TINNTEN_MCP_REGISTRY_URL=http://tinnten-server-mcp-registry:5001/api/v10/internal/mcp-servers/resolve
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3900/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      tinnten-mcp-internal:
        aliases:
          - mcp-runtime
      tinnten-mcp-egress:
      tinnten-mcp-registry:

  # Builder UI ve servera özel OAuth/JWT korumalı hosted MCP gateway.
  # Yalnız loopback'e açılır;
  # production HTTPS reverse proxy 127.0.0.1:8095'e yönlendirilmelidir.
  tinnten-mcp-web:
    build:
      context: ./tinnten-mpc-server
      dockerfile: deploy/Dockerfile
      target: web-hosted
    env_file:
      - ./tinnten-mpc-server/.env
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      tinnten-mpc-control-api:
        condition: service_healthy
      tinnten-mpc-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    networks:
      - tinnten-mcp-internal
      - tinnten-mcp-gateway

  tinnten-cron:
    build:
      context: ./tinnten-cron
    env_file:
      - ./tinnten-cron/.env
    ports:
      - "127.0.0.1:5007:5005"
    restart: always
    logging: *default-logging
    depends_on:
      - redis
      - rabbitmq
      - mongodb
    environment:
      - NODE_ENV=production
      # tinnten-cron/.env `PORT=5007` diyor ve env_file ile konteynere giriyordu;
      # oysa yayınlanan port, Dockerfile EXPOSE ve tinnten-server'ın dial ettiği
      # adres (CRON_SERVICE_URL=http://tinnten-cron:5005) 5005. Konteyner 5007'de
      # dinlediği için cron job oluşturma/güncelleme çağrıları ECONNREFUSED
      # alıyordu → cron listeleri hiç zamanlanmıyordu. `environment:` env_file'ı
      # ezer; docker-compose.preprod.yml'de bu satır zaten var.
      - PORT=5005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=tinntenRedis123
      - ELASTICSEARCH_BASE_URL=http://elasticsearch:9200
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - DB_TINNTEN=tinnten-cron
      - RABBITMQ_PROTOCOL=amqp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - FETCHER_URL=http://tinnten-fetcher:5005
      - EMBEDDING_BASE_URL=http://tinnten-embedding:5003
      - PRODUCT_CATALOG_SERVICE_URL=http://product-catalog:5010
      - RABBIT_URL=amqp://admin:password@rabbitmq:5672/
      - CRON_WEBHOOK_SECRET=tinnten-cron-secret-2026
    networks:
      - tinnten-net

  tinnten-fetcher:
    build:
      context: ./tinnten-fetcher
    container_name: tinnten-fetcher
    env_file:
      - ./tinnten-fetcher/.env
    ports:
      - "127.0.0.1:5005:5005"
    restart: always
    logging: *default-logging
    depends_on:
      - redis
      - rabbitmq
      - mongodb
    environment:
      # Sema held-out dogrulama esigi: 0.8 -> 0.6 (24 Tem 2026).
      # HOLDOUT=3 iken 0.8 => passed/3 >= 0.8 => UCUNUN DE gecmesi gerekiyordu;
      # tek liste/paywall/404 sayfasi tum semayi dusuruyordu (failed_validation).
      # 0.6 => 2/3 yeterli. Kalite guvencesi korunur: sema yine >=300 karakter
      # + %50 proza uretmek zorunda, yanlis sema runtime'da fit_markdown'a duser.
      - EXTRACTION_VALIDATE_PASS_RATIO=0.6
      # Index kuyrugu backpressure esigi: 160000 -> 20000 (25 Tem 2026).
      # Varsayilan 160000, content_indexing_queue'nun tam o derinlikte ASILI
      # kalmasina yol aciyordu: ingest ne kadar bosaltsa fetcher hemen ayni
      # kadar yeni sayfa-index tetikliyordu, birikim hic erimiyordu. Esik
      # dusurulunce fetcher kuyruk 20000'in altina inene kadar YENI tetikleme
      # yapmaz ve birikim erir. Kayipsiz: backpressure aktifken watermark da
      # yazilmaz, sayfa sonraki crawl dongusunde yeniden denenir
      # (bkz. result_processor.py `_embed_queue_over_limit`).
      - EMBED_QUEUE_BACKPRESSURE_DEPTH=20000
      - PORT=5005
      - AUTH_ENABLED=true
    volumes:
      - fetcher_raw_pages:/var/data/raw-pages
    mem_limit: 8g
    cpus: 2.0
    networks:
      - tinnten-net

  tinnten-embedding:
    build:
      context: ./tinnten-embedding
    env_file:
      - ./tinnten-embedding/.env
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      # --- RAG v2 retrieval (tinnten-embedding/docs/RAG_V2_ROADMAP.md) ---
      # Bu blok BUGUN DAVRANIS DEGISTIRMEZ. Amaci, daha once HICBIR deploy
      # artefaktinda gorunmeyen retrieval anahtarlarini acikca ortaya koymak;
      # rollout/rollback tek satir olsun.
      #
      # Kod varsayilanlariyla karsilastirma (runtime'da dogrulandi):
      #   HYBRID_SEARCH_ENABLED / HYBRID_OVERFETCH / RRF_K_CONSTANT /
      #   RERANKER_MODEL / CHUNK_STRATEGY / INGEST_LEASE_SECONDS -> AYNI.
      #   RERANK_TOP_N -> kod varsayilani 30, burada 20. Reranker KAPALI oldugu
      #   surece ATIL (etkisi yok); RERANKER_MODEL doldurulunca devreye girer.
      #   20 = Faz 4'un CPU-bilincli baslangic degeri, p95 olcumune gore ayarla.
      #
      # Hybrid = dense FAISS + lexical Mongo $text, RRF ile birlestirilir.
      # ON KOSUL: `chunk_text_search` index'i GERCEKTEN var olmali. Index
      # olusturma hatasi kodda sessizce yutuluyor ve $text hata vermeden BOS
      # donuyor -> hybrid "acik" gorunur ama tek bacakla calisir, fark edilmez.
      # Acmadan once:  python3 scripts/rag_preflight.py --company-id <ID>
      # Kademeli acilis icin firma-bazli canary (server override) tercih edilir;
      # bu global anahtar TUM firmalari birden etkiler.
      - HYBRID_SEARCH_ENABLED=false
      - HYBRID_OVERFETCH=4
      - RRF_K_CONSTANT=60
      # Reranker: BOS = kapali. Doldurmadan once Faz 4'u oku:
      #  * model ~2GB; Dockerfile onu build'de INDIRMIYOR -> ilk sorguda
      #    runtime'da iner. HF cache `embedding_data` volume'unda DEGIL (orasi
      #    yalniz FAISS) -> her image rebuild'de ~2GB yeniden iner.
      #  * prod CPU-only (torch+cpu) -> p95 latency OLCULMEDEN acma.
      #  * yuklenemezse servis healthy kalir ve arama SESSIZCE rerank'siz doner;
      #    gorunurluk: GET /api/v10/config -> reranker_loaded/reranker_load_error
      - RERANKER_MODEL=
      - RERANK_TOP_N=20
      # Chunking: char | structure | auto. `auto` (Faz 7/KN3) icerige gore secer:
      # markdown basligi VARSA structure, YOKSA char (schema-derived basliksiz
      # metinde structure faydasiz). Degistirmek REINDEX ister.
      - CHUNK_STRATEGY=char
      # Faithful schema reindex (Faz 6): fetcher DB-read yolunda schema-derived
      # metni markdown'dan once kullan (crawl_results.extracted.extracted_content).
      # Varsayilan KAPALI; reindex surucusu bilincli acar. MIN_CHARS fetcher
      # Config.INDEX_SCHEMA_MIN_CHARS (=200) ile AYNI olmali.
      - INDEX_SCHEMA_CONTENT_ENABLED=false
      - INDEX_SCHEMA_MIN_CHARS=200
      # Ingest kilidi lease suresi (sn) — worker olurse kilit devralinabilsin.
      - INGEST_LEASE_SECONDS=900
      - MAX_PAGES_ENFORCEMENT_ENABLED=1
      # Per-company FAISS production migration settings.
      - PER_COMPANY_FAISS_ENABLED=true
      - FILTERED_SEARCH_MIN_CANDIDATES=200
      - FILTERED_SEARCH_MAX_CANDIDATES=200
    volumes:
      # FAISS index files live under /app/data; without a named volume every
      # image rebuild wipes the vectors while chunk metadata stays in Mongo
      # (causes "indexed but search returns 0" — see embedding_architecture.md).
      - embedding_data:/app/data
    mem_limit: 12g
    cpus: 8.0
    depends_on:
      - rabbitmq
      - mongodb
      - elasticsearch
    networks:
      - tinnten-net

  # ── Faz 0 (embedding-search-saturation): ingest consumer HTTP'den AYRILDI ──
  # AYNI imaj, komut worker.py. FAISS volume'u tinnten-embedding ile PAYLASIR
  # (yazma fcntl _write_lock ile cross-process guvenli, _save_index atomik,
  # okuyan reload_if_updated/mtime ile tazelenir). environment blogu
  # tinnten-embedding ile AYNI tutulmali (ozellikle MONGO_URI, RABBITMQ_*,
  # CHUNK_STRATEGY, INDEX_SCHEMA_*, INGEST_LEASE_SECONDS).
  tinnten-embedding-ingest:
    build:
      context: ./tinnten-embedding
    command: ["python", "worker.py"]
    # Replika sayisi BURADA sabit (25 Tem 2026). Onceden yalnizca
    # `--scale tinnten-embedding-ingest=2` ile ayaga kaldiriliyordu; bu yuzden
    # --scale'siz calistirilan herhangi bir `docker compose up -d` olcegi
    # sessizce 1'e indirip ikinci worker'i SILIYORDU (canlida yasandi: throughput
    # yariya dustu, container `docker ps -a`'da bile gorunmedigi icin fark
    # edilmesi zor). Burada tanimliyken compose her seferinde 2'ye yakinsar.
    deploy:
      replicas: 2
    env_file:
      - ./tinnten-embedding/.env
    restart: always
    logging: *default-logging
    environment:
      # Toplu ingest (25 Tem 2026): content-index mesajlari firma bazinda
      # gruplanip TEK FAISS yazimiyla islenir (dokuman basina 2 tam index
      # yazimi -> grup basina 1). Kodda varsayilan zaten true; burada acikca
      # sabitlendi ki davranis gorunur olsun ve gerekirse false'a cekip
      # yeniden baslatmak yetsin (rebuild gerekmez).
      - INGEST_BATCH_ENABLED=true
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - HYBRID_SEARCH_ENABLED=false
      - HYBRID_OVERFETCH=4
      - RRF_K_CONSTANT=60
      - RERANKER_MODEL=
      - RERANK_TOP_N=20
      - CHUNK_STRATEGY=char
      - INDEX_SCHEMA_CONTENT_ENABLED=false
      - INDEX_SCHEMA_MIN_CHARS=200
      - INGEST_LEASE_SECONDS=900
      # ── Faz 1 (embedding-search-saturation): per-company FAISS AÇIK ──
      # Migration 24 Tem 2026 --apply: 28 firma / 233.040 vektör kopyalandı
      # (rollback: bu 3 satırı sil + iki embedding servisini birlikte restart;
      # global faiss.index DOKUNULMADI, yedek /root/backups/faiss.index.bak-faz1-*).
      # Izolasyon yapisal oldugu icin 5000'lik over-fetch 200'e indirildi.
      - PER_COMPANY_FAISS_ENABLED=true
      - FILTERED_SEARCH_MIN_CANDIDATES=200
      - FILTERED_SEARCH_MAX_CANDIDATES=200
    volumes:
      - embedding_data:/app/data
    mem_limit: 8g
    cpus: 6.0
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  product-catalog:
    build:
      context: ./tinnten-product-catalog
    env_file:
      - ./tinnten-product-catalog/.env
    ports:
      - "127.0.0.1:5010:5010"
    restart: always
    logging: *default-logging
    depends_on:
      - rabbitmq
      - mongodb
    environment:
      - NODE_ENV=production
      - CATALOG_PORT=5010
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - CATALOG_DB_NAME=tinnten-product-catalog
      - RABBITMQ_PROTOCOL=amqp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - REDIS_HOST=redis
      - REDIS_PASSWORD=tinntenRedis123
    networks:
      - tinnten-net

  product-catalog-worker:
    build:
      context: ./tinnten-product-catalog
    env_file:
      - ./tinnten-product-catalog/.env
    command: ["python", "product_catalog_worker.py"]
    restart: always
    logging: *default-logging
    depends_on:
      - rabbitmq
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - CATALOG_DB_NAME=tinnten-product-catalog
      - RABBITMQ_PROTOCOL=amqp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
    networks:
      - tinnten-net

  analytics-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "analyticsworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  email-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "emailworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  # Otel rezervasyon dosyaları ürün importlarından ayrı kuyruk/process tüketir.
  # Böylece büyük bir konaklama dosyası ürün import hattını bloke etmez.
  appointment-import-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "appointmentimportworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  # Dosya ve platform connector'larından gelen ürünleri batch olarak işler.
  # Tek consumer büyük kataloglarda bellek kullanımını ve DB basıncını sınırlar.
  product-import-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "productimportworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - IMPORT_WORKER_PREFETCH=1
      - IMPORT_BATCH_SIZE=500
      - IMPORT_PRODUCT_CONCURRENCY=8
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  # Toplu mail kampanya worker'ı — ayrı campaign_email_queue'yu tüketir
  # (büyük blast transactional email-worker'ı bloklamasın). prefetch(1) +
  # kampanya sendConfig.ratePerSec ile throttle eder. SES itibar ayarları
  # (SES_CONFIGURATION_SET, SES_CAMPAIGN_MAX_RATE) .env'den gelir.
  # ⚠️ TEK REPLİKA KALMALI: dedupe garantisi tek consumer'ın seri işlemesine
  # dayanır — maillog {campaignId,to} claim'i "queued" satırında yeniden
  # göndermeye izin verir; 2+ replika aynı alıcıya çift mail atabilir. Ayrıca
  # ratePerSec throttle'ı süreç-içi sleep'tir: N replika = N × SES hızı.
  campaign-email-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "campaignworker"]
    restart: always
    logging: *default-logging
    environment:
      - SES_CONFIGURATION_SET=tinnten-campaigns
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  db-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "dbworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 4g
    cpus: 2.0
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  # ─────────────────────────────────────────────────────────────────────────
  # Error Worker (in-house hata izleme — eski Sentry yerine)
  #
  # error_queue'yu tüketir → error_events + error_issues (Mongo). Token'lı
  # hatalarda kullanıcıyı Keycloak'tan çözer (.env admin creds) ve Redis'te
  # cache'ler. tinnten-server DISABLE_AUTO_ERROR_WORKER=true ile auto-spawn
  # kapalı; bu container tek tüketici (file-intelligence-worker ile aynı desen).
  # ─────────────────────────────────────────────────────────────────────────
  error-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "errorworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=tinntenRedis123
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
      - redis
    networks:
      - tinnten-net

  productization-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "productizationworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=tinntenRedis123
      - REDIS_URL=redis://:tinntenRedis123@redis:6379
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - FETCHER_URL=http://tinnten-fetcher:5005
      - PRODUCTIZATION_FETCHER_CLAIM_ENABLED=true
      - PRODUCTIZATION_CRAWL_LIMIT=0
      - PRODUCTIZATION_FETCHER_CLAIM_PAGE_SIZE=50
      - PRODUCTIZATION_FETCHER_HTTP_TIMEOUT=180000
    mem_limit: 6g
    cpus: 1.0
    depends_on:
      - rabbitmq
      - mongodb
      - tinnten-fetcher
    networks:
      - tinnten-net
      - tinnten-ai-net

  # ─────────────────────────────────────────────────────────────────────────
  # User Product Categorization Worker
  #
  # Wizard / panel'den eklenen kullanıcı ürün ve hizmetleri için Ollama
  # üzerinden 4-seviyeli kategori tahmini yapar, mevcut DB'de findOrCreate
  # ile aiCategories alanını doldurur.
  #
  # ÖNEMLI: tinnten-productization-worker'la KARIŞTIRMA — o kazıma
  # ürünleri (scrap pipeline) için. Bu ayrı bir akış, kullanıcı tarafı.
  #
  # Plan kaynağı: ~/.claude/plans/wizard-company-categorization/INDEX.md
  # ─────────────────────────────────────────────────────────────────────────
  user-product-categorization-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "userproductcategorizationworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      # Ollama config — qwen2.5:7b prod'da yüklü
      - OLLAMA_URL=http://tinnten-ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_DISABLED=false
      # Worker tuning
      - USER_PRODUCT_CATEGORIZATION_PREFETCH=1
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
      - ollama
    networks:
      - tinnten-net
      - tinnten-ai-net

  search-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["sh", "-c", "until curl -s http://elasticsearch:9200 >/dev/null; do sleep 3; done; npm run searchworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      - rabbitmq
      - mongodb
      - elasticsearch
    networks:
      - tinnten-net

  wallet-log-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["node", "src/workers/walletLogWorker.js"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
    networks:
      - tinnten-net

  file-intelligence-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["node", "src/workers/fileIntelligenceWorker.js"]
    restart: always
    logging: *default-logging
    volumes:
      - conversation_storage:/app/storage/conversation
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
      - CLAMAV_ENABLED=true
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      - rabbitmq
      - mongodb
      - clamav
    networks:
      - tinnten-net

  company-information-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["node", "src/workers/companyInformationWorker.js"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
      - FETCHER_URL=http://tinnten-fetcher:5005
      - EMBEDDING_BASE_URL=http://tinnten-embedding:5003
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net


  subscription-worker:
    build:
      context: ./tinnten-server
    env_file:
      - ./tinnten-server/.env
    command: ["npm", "run", "subscriptionworker"]
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=password
      - RABBITMQ_VHOST=/
      - RABBITMQ_AUTH_MECHANISM=PLAIN,AMQPLAIN,EXTERNAL
      - MONGO_URI=mongodb://root:tinntenMongo123@mongodb:27017/tinnten?authSource=admin
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - tinnten-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.50.0
    restart: always
    logging: *default-logging
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - tinnten-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
    networks:
      - tinnten-net
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - tinnten-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ZFrUhpmZYQAMbvdW4NF3gY15xMMA
      - GF_USERS_DEFAULT_THEME=light
      # CMS içine iframe ile gömme için gerekli (Sistem İzleme > Grafana sekmesi)
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # CMS (Vercel) iframe'i çapraz-site olduğundan oturum çerezi için gerekli:
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
      # Sub-path modu: nginx api.tinnten.com/grafana/ -> bu container (port 3000)
      - GF_SERVER_ROOT_URL=https://api.tinnten.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tinnten-net

  # n8n Community Edition workflow automation. The application port is bound
  # to loopback only and is published through the host Nginx reverse proxy.
  n8n-postgres:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    env_file:
      - ./n8n-postgres.env
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    networks:
      - n8n-net

  n8n:
    image: n8nio/n8n:2.40.5
    restart: always
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - ./n8n.env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      - n8n-net

  ollama:
    image: ollama/ollama:latest
    container_name: tinnten-ollama
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=3
    mem_limit: 14g
    cpus: 18.0
    networks:
      - tinnten-net
      - tinnten-ai-net

  portainer:
    image: portainer/portainer-ce:2.20.3
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - tinnten-net


volumes:
  redis_data:
  mongo_data:
  mongo_public_data:
  esdata:
  prometheus_data:
  grafana_data:
  n8n_data:
  n8n_postgres_data:
  portainer_data:
  ollama_data:
  clamav_data:
  embedding_data:
    # FAISS index persistence for tinnten-embedding. Stores /app/data/faiss/
    # (faiss.index + sidecars). Mongo holds chunk metadata; this volume holds
    # the actual vectors. Both must survive across image rebuilds.
  conversation_storage:
    # Fixed host path for conversation attachment staging.
    # Size is managed at the host filesystem level; reserve at least 50 GB on /srv.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/tinnten/conversation-storage
  fetcher_raw_pages:
    # Fixed host path for fetcher disk-storage mode (raw scraped pages).
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/tinnten/fetcher-raw-pages

networks:
  tinnten-net:
    driver: bridge
  n8n-net:
    driver: bridge
  # Kiraci site container'lari. Bilincli olarak `internal` DEGIL:
  # izolasyon, Mongo/Redis/ES'in bu agda OLMAMASINDAN gelir.
  sites-net:
    name: sites-net
    driver: bridge
  tinnten-ai-net:
    driver: bridge
    internal: true
  tinnten-mcp-gateway:
    driver: bridge
  tinnten-mcp-internal:
    driver: bridge
    internal: true
  tinnten-mcp-egress:
    driver: bridge
  tinnten-mcp-registry:
    driver: bridge
    internal: true
